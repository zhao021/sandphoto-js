<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片排版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <main id="photo-layout-container" class="app-main"></main>
    </div>

    <script src="phototypes.js"></script>
    <script src="layout-engine.js"></script>
    <script src="ui-generator.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langConfig = UIGenerator.getChineseConfig();
            const uiGenerator = new UIGenerator({
                ...langConfig,
                previewType: 'canvas'
            });

            const container = document.getElementById('photo-layout-container');
            container.appendChild(uiGenerator.generateCompleteForm('photo-layout-form'));

            window.photoLayoutApp = new PhotoLayoutApp({
                texts: langConfig.texts
            });
        });
    </script>
</body>
</html>
